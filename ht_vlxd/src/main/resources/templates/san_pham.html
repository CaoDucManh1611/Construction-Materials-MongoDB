<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><link rel="icon" type="image/svg+xml" href="/images/store/favicon.svg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh mục vật liệu — Sài Gòn CMC</title><meta name="description" content="Tra cứu và lọc thép, xi măng, gạch, cát, đá. Xem quy cách và đơn giá vật liệu tại Sài Gòn CMC."><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/site.css"><script src="/js/security.js"></script><script src="/js/ui.js" defer></script><script src="/js/storefront.js" defer></script></head><body class="storefront"><div th:replace="~{bo_cuc/store :: header}"></div>
<main id="main" class="container"><nav class="breadcrumb" aria-label="Đường dẫn"><a href="/">Trang chủ</a><span>/</span><span>Vật liệu</span></nav><div class="catalog-title-block"><p class="eyebrow">LỰA CHỌN CHO CÔNG TRÌNH CỦA BẠN</p><h1>Danh mục vật liệu</h1><p>Đúng quy cách. Rõ đơn giá. Dễ dàng tìm kiếm và lựa chọn.</p></div><div class="catalog-toolbar"><div class="search-field"><label for="catalog-search" class="sr-only">Tìm vật liệu</label><input id="catalog-search" type="search" placeholder="Tìm tên vật liệu, ví dụ: xi măng…"></div><span id="catalog-count" aria-live="polite"></span><div><label for="catalog-sort" class="sr-only">Sắp xếp vật liệu</label><select id="catalog-sort" class="form-control"><option value="name">Theo tên vật liệu</option><option value="low">Giá từ thấp đến cao</option><option value="high">Giá từ cao đến thấp</option></select></div></div><div class="filter-chips" aria-label="Lọc nhóm vật liệu"><button type="button" class="filter-chip active" data-category="all" aria-pressed="true">Tất cả vật liệu</button><button type="button" th:each="cat : ${danhMucs}" th:data-category="${cat.id}" class="filter-chip" aria-pressed="false" th:text="${cat.ten}"></button></div><div id="catalog-grid" class="store-products catalog-grid"><th:block th:each="prod : ${hangHoas}"><article th:replace="~{bo_cuc/store :: product(${prod})}"></article></th:block></div><div id="catalog-empty" class="empty-result" hidden><h2>Chưa tìm thấy vật liệu phù hợp</h2><p>Thử đổi tên tìm kiếm hoặc chọn nhóm vật liệu khác.</p></div></main><div th:replace="~{bo_cuc/store :: footer}"></div></body></html>
